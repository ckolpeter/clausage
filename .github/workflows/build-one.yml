# 單一平台的建置步驟，由 build.yml 呼叫（三平台共用，macOS 備援也用這份）
name: Build one platform

on:
  workflow_call:
    inputs:
      os:
        description: runs-on 標籤，例如 windows-latest / macos-latest / macos-26-intel
        required: true
        type: string
      target:
        description: electron-builder 平台參數：--win / --mac / --linux
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build (${{ inputs.os }}, ${{ inputs.target }})
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # 有 package-lock.json 時用 npm ci，否則 npm install
      - name: Install
        shell: bash
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Syntax check
        shell: bash
        run: for f in src/*.js; do node --check "$f"; done

      - name: Unit tests
        run: npm test

      - name: Build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 尚未設定簽章：停用 macOS 自動尋找憑證
          # 之後加入簽章時，設定 secrets：CSC_LINK、CSC_KEY_PASSWORD、APPLE_ID、APPLE_APP_SPECIFIC_PASSWORD、APPLE_TEAM_ID
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK == '' && 'false' || 'true' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          # 沒有憑證時 CSC_LINK 會是空字串，electron-builder 會把它當成專案資料夾去簽章 → 「not a file」
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            npx electron-builder ${{ inputs.target }} --publish always
          else
            npx electron-builder ${{ inputs.target }} --publish never
          fi

      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: clausage-${{ inputs.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore
          retention-days: 7
