name: 問題回報 / Bug report
description: 小工具顯示錯誤、當掉或抓不到資料
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "⚠️ 請勿貼上 sessionKey、Cookie 或任何登入憑證。Never paste your sessionKey or tokens."
  - type: dropdown
    id: os
    attributes:
      label: 作業系統 / OS
      options: [Windows 11, Windows 10, macOS (Apple Silicon), macOS (Intel), Linux]
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Clausage 版本 / Version, placeholder: v0.1.0 }
    validations: { required: true }
  - type: dropdown
    id: source
    attributes:
      label: 資料來源 / Data source
      options: [claude.ai 帳號, Claude Code 憑證]
  - type: dropdown
    id: plan
    attributes:
      label: 方案 / Plan
      options: [Pro, Max, Team, Enterprise, Free, 其他]
  - type: textarea
    id: what
    attributes:
      label: 發生了什麼 / What happened
      description: 小工具上的錯誤訊息、截圖（請遮住個人資訊）
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: 重現步驟 / Steps to reproduce }
