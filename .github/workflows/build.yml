# 推送到 main / 發 PR：三平台建置檢查（不發佈）
# 推送 v* 標籤（例如 v0.1.0）：三平台建置並上傳到 GitHub Release 草稿
# 實際步驟在 build-one.yml
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    uses: ./.github/workflows/build-one.yml
    with:
      os: ${{ matrix.os }}
      target: ${{ matrix.target }}
    secrets: inherit

  mac:
    uses: ./.github/workflows/build-one.yml
    with:
      os: macos-latest
      target: --mac
    secrets: inherit

  # GitHub 的 macOS arm64 機器常常不夠用：排不到機器時工作會在約 15 分鐘後被取消
  # （"The job was not acquired by Runner…"）。這時改在另一批 Intel 機器上建置。
  # 產生的是 universal 版本，在 Intel 上建出來的 dmg / zip 一樣。
  # 如果 arm64 失敗是程式本身的問題，這裡也會失敗，只是多花幾分鐘。
  mac-fallback:
    needs: mac
    if: ${{ always() && needs.mac.result != 'success' && needs.mac.result != 'skipped' }}
    uses: ./.github/workflows/build-one.yml
    with:
      os: macos-26-intel
      target: --mac
    secrets: inherit
